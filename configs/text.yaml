# Text Pipeline Configuration
contextual_backbone: "sentence-transformers/all-MiniLM-L6-v2"
embedding_dim: 384
max_length: 128

legacy_tfidf:
  ngram_range: [1, 3]
  max_features: 12000
  sublinear_tf: true

model:
  contextual_checkpoint: "models/text_classifier/best_text_model_contextual.pt"
  legacy_checkpoint: "models/text_classifier/best_text_model.joblib"
  num_classes: 7

